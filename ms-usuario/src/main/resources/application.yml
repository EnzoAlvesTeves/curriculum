server:
  port: 8081
spring:
  application:
    name: ms-usuario
  datasource:
    url: jdbc:mysql://localhost:3306/ms_usuario
    username: user_usuario
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    cleanDisabled: false