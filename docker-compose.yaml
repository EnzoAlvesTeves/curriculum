services:
  curriculum-db:
    image: mysql:8.0
    container_name: curriculum-db
    restart: always
    networks:
      - curriculum-net
    environment:
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: curriculum-keycloak
    command:
      - start-dev
      - --import-realm
    networks:
      - curriculum-net
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8093:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

  ms-usuario:
    build: './ms-usuario'
    container_name: ms-usuario
    restart: on-failure
    depends_on:
      curriculum-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - curriculum-net
    environment:
      - DB_HOST=curriculum-db
      - DB_PORT=3306
      - DB_NAME=ms_usuario
      - DB_USER=user_usuario
      - DB_PASSWORD=admin
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=curriculum
      - KEYCLOAK_ADMIN_CLIENT_ID=curriculum-app-admin
      - KEYCLOAK_ADMIN_CLIENT_SECRET=cJLeqvJ5KE8OUCPIUuIhULXmx3CCdwGO
      - KEYCLOAK_USER_CLIENT_ID=curriculum-app-user
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/curriculum
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/curriculum/protocol/openid-connect/certs
    ports:
      - "8091:8091"

  ms-curriculum:
    build: './ms-curriculum'
    container_name: ms-curriculum
    restart: on-failure
    depends_on:
      curriculum-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      ms-usuario:
        condition: service_started
    networks:
      - curriculum-net
    environment:
      - DB_HOST=curriculum-db
      - DB_PORT=3306
      - DB_NAME=ms_curriculum
      - DB_USER=user_curriculum
      - DB_PASSWORD=admin
      - MS_USUARIO_URL=http://ms-usuario:8091
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/curriculum
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/curriculum/protocol/openid-connect/certs
    ports:
      - "8090:8090"

  ms-vagas:
    build: './ms-vagas'
    container_name: ms-vagas
    restart: on-failure
    depends_on:
      curriculum-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      ms-usuario:
        condition: service_started
    networks:
      - curriculum-net
    environment:
      - DB_HOST=curriculum-db
      - DB_PORT=3306
      - DB_NAME=ms_vagas
      - DB_USER=user_vagas
      - DB_PASSWORD=admin
      - MS_USUARIO_URL=http://ms-usuario:8091
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/curriculum
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/curriculum/protocol/openid-connect/certs
    ports:
      - "8092:8092"

  kong:
    image: kong:3.7
    container_name: curriculum-kong
    restart: on-failure
    depends_on:
      ms-usuario:
        condition: service_started
      ms-curriculum:
        condition: service_started
      ms-vagas:
        condition: service_started
    networks:
      - curriculum-net
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/kong.yml
    ports:
      - "8000:8000"
      - "8001:8001"

networks:
  curriculum-net:
    driver: bridge