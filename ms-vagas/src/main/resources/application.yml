server:
  port: 8082
spring:
  application:
    name: ms-vagas
  datasource:
    url: jdbc:mysql://localhost:3306/ms_vagas
    username: user_vagas
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    cleanDisabled: false