<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Candidatos - WiseCorp</title>
		<link rel="icon" href="/img/logo.jpg" type="image/jpg">
		<link rel="stylesheet" href="/styles/header.css">
		<link rel="stylesheet" href="/styles/main.css">
		<link rel="stylesheet" href="/styles/vaga.css">
</head>
<body class="wise-background">

		<header>
				<div class="logo" >
						<a th:href="@{/usuario/home/{id}(id=${usuario.id})}">
								WiseCorp
						</a>
				</div>

				<nav>
						<ul>
								<li th:if="${usuario != null}">
										<span style="font-weight:bold;">Olá, <span th:text="${usuario.nome}"></span></span>
								</li>

								<li th:if="${usuario != null && candidato == null && usuario.id != 1}">
										<a th:href="@{/candidato/cadastrar(usuarioId=${usuario.id})}">Cadastrar Currículo</a>
								</li>

								<li th:if="${usuario != null}">
										<a th:href="@{/vaga/lista/usuario/{id}(id=${usuario.id})}">Vagas</a>
								</li>

								<li th:if="${usuario.id == 1}">
										<a th:href="@{/vaga/cadastrar/usuario/{id}(id=${usuario.id})}">Cadastrar Vagas</a>
								</li>
						</ul>
				</nav>
		</header>

		<div id="lista-candidatos">
				<div class="vaga wise-background" th:each="candidato : ${candidatos}" onclick="this.classList.toggle('ativa')">
						<h2 th:text="${candidato.nome}">Nome do Candidato</h2>

						<p th:if="${candidato.resumoProfissional != null}">
								<strong>Resumo:</strong>
								<span th:text="${candidato.resumoProfissional}"></span>
						</p>

						<div class="detalhes">
							<!-- substituído #lists.isNotEmpty(...) por checagem SpEL segura -->
								<p th:if="${candidato.experiencias != null and !candidato.experiencias.isEmpty()}">
										<strong>Experiências:</strong>
										<span th:text="${candidato.experiencias.size()}"></span> registro(s)
								</p>

								<p>
										<strong>Contato:</strong>
										<span th:if="${candidato.usuario != null}">
												<span th:text="${candidato.usuario.email}">email@exemplo.com</span>
												<span th:if="${candidato.telefone != null}"> - <span th:text="${candidato.telefone}"></span></span>
										</span>

										<span th:if="${candidato.usuario == null}">
												<span th:if="${candidato.email != null}" th:text="${candidato.email}">email@exemplo.com</span>
												<span th:if="${candidato.telefone != null}"> - <span th:text="${candidato.telefone}"></span></span>
										</span>
								</p>

								<br>

								<a th:href="@{/candidato/{id}(id=${candidato.id})}" class="wise-btn">Ver Currículo</a>
						</div>
				</div>
		</div>

</body>
</html>
