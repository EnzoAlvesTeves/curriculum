<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<title>Cadastro de Vaga</title>
	<link rel="icon" href="/img/logo.jpg" type="image/jpg">
	<link rel="stylesheet" href="/styles/header.css">
	<link rel="stylesheet" href="/styles/main.css">

	<style>
		.content {
			margin-top: 100px;
			display: flex;
			justify-content: center;
		}

		form {
			background-color: white;
			padding: 30px;
			border-radius: 8px;
			border: 1px solid #ddd;
			width: 500px;
		}

		h1 {
			color: #ff7f27;
			text-align: center;
		}

		fieldset {
			margin-bottom: 1.5em;
			padding: 1em;
			border: 2px solid #ff7f27;
			border-radius: 8px;
		}

		.form-group {
			display: flex;
			align-items: center;
			margin-bottom: 15px;
		}

		.form-group label {
			width: 120px;
			margin-right: 10px;
			text-align: right;
		}

		.form-group input,
		.form-group textarea,
		.form-group select {
			flex: 1;
			padding: 8px;
			border: 1px solid #ccc;
			border-radius: 5px;
		}

		.form-group textarea {
			height: 80px;
		}

	</style>
</head>
<body class="wise-background">
		<header>
				<div class="logo" >
						<a th:href="@{/usuario/home/{id}(id=${usuario.id})}">
								WiseCorp
						</a>
				</div>

				<nav>
						<ul>
								<li th:if="${usuario != null}">
										<span style="font-weight:bold;">Olá, <span th:text="${usuario.nome}"></span></span>
								</li>

								<li th:if="${usuario != null && candidato == null && usuario.id != 1}">
										<a th:href="@{/candidato/cadastrar(usuarioId=${usuario.id})}">Cadastrar Currículo</a>
								</li>

								<li th:if="${usuario != null}">
										<a th:href="@{/vaga/lista/usuario/{id}(id=${usuario.id})}">Vagas</a>
								</li>

								<li th:if="${usuario.id == 1}">
										<a th:href="@{/vaga/cadastrar/usuario/{id}(id=${usuario.id})}">Cadastrar Vagas</a>
								</li>
						</ul>
				</nav>
		</header>

		<div class="content">
			<form th:action="@{/vaga/cadastrar}" method="post">
				<h1>Cadastro de Vaga</h1>
				<fieldset>

					<div class="form-group">
						<label>Titulo:</label>
						<input type="text" name="titulo"/>
					</div>

					<div class="form-group">
						<label>Descricao:</label>
						<textarea name="descricao"></textarea>
					</div>

					<div class="form-group">
						<label>Empresa:</label>
						<input type="text" name="empresa">
					</div>

					<div class="form-group">
						<label>Beneficio:</label>
						<textarea name="beneficios"></textarea>
					</div>

					<div class="form-group">
						<label>Salario:</label>
						<input type="text" name="salario"/>
					</div>

				</fieldset>

				<button class="wise-btn" type="submit">Salvar</button>

			</form>
		</div>
</body>
</html>
