<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Área do Candidato</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .section {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .section h2 {
      margin-top: 0;
      color: #444;
    }

    .info {
      margin: 10px 0;
      color: #666;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #f57c00;
      color: white;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #e66a00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Área do Candidato</h1>
    <p style="text-align:center; color:#555;">Gerencie seu currículo e acompanhe suas candidaturas</p>

    <div class="section">
      <h2>Meu Currículo</h2>
      <p class="info">Nenhum currículo cadastrado</p>
      <a href="#" class="btn">+ Criar Currículo</a>
    </div>

    <div class="section">
      <h2>Minhas Candidaturas</h2>
      <p class="info">0 candidatura(s) enviada(s)</p>
      <p class="info">Você ainda não se candidatou a nenhuma vaga</p>
      <a href="#" class="btn">Explorar Vagas</a>
    </div>
  </div>
</body>
</html>
