server:
  port: 8080
spring:
  application:
    name: ms-curriculum
  datasource:
    url: jdbc:mysql://localhost:3306/ms-curriculum
    username: user_curriculum
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    cleanDisabled: false